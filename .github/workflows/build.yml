name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: flutter create --org com.guitartuner --project-name guitar_tuner /tmp/guitar_tuner

      - name: Copy source files
        run: |
          cp -r lib/* /tmp/guitar_tuner/lib/
          cp pubspec.yaml /tmp/guitar_tuner/pubspec.yaml

      - name: Configure Android
        run: python3 scripts/configure_android.py

      - name: Inject MainActivity
        run: |
          KDIR=/tmp/guitar_tuner/android/app/src/main/kotlin/com/guitartuner/guitar_tuner
          cp android_src/MainActivity.kt $KDIR/MainActivity.kt

      - name: Flutter pub get
        working-directory: /tmp/guitar_tuner
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: /tmp/guitar_tuner
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        working-directory: /tmp/guitar_tuner
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "======= BUILD ERROR ======="
            grep -A5 "FAILURE\|What went wrong\|error:" /tmp/build.log | head -80
            exit $BUILD_STATUS
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-apk
          path: /tmp/guitar_tuner/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
