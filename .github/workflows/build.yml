name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: flutter create --org com.guitartuner --project-name guitar_tuner /tmp/guitar_tuner

      - name: Copy source files
        run: |
          cp -r lib/* /tmp/guitar_tuner/lib/
          cp pubspec.yaml /tmp/guitar_tuner/pubspec.yaml

      - name: Configure Android
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          manifest_path = pathlib.Path('/tmp/guitar_tuner/android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          if 'RECORD_AUDIO' not in manifest:
              manifest = manifest.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application'
              )
              manifest_path.write_text(manifest)

          gradle_path = pathlib.Path('/tmp/guitar_tuner/android/app/build.gradle')
          g = gradle_path.read_text()
          g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', g)
          g = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk 21', g)
          g = re.sub(r'\s*ndkVersion\s+flutter\.ndkVersion', '', g)
          g = g.replace(
              'versionName flutterVersionName',
              'versionName flutterVersionName\n        multiDexEnabled true'
          )
          gradle_path.write_text(g)
          print("build.gradle after patch:")
          print(gradle_path.read_text())
          PYEOF

      - name: Flutter pub get
        working-directory: /tmp/guitar_tuner
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: /tmp/guitar_tuner
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK (verbose)
        working-directory: /tmp/guitar_tuner
        run: flutter build apk --debug --verbose 2>&1 | tail -200
        continue-on-error: true

      - name: Check if APK exists
        id: apk_check
        run: |
          if [ -f /tmp/guitar_tuner/build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "APK built successfully!"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "APK NOT found — build failed"
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.apk_check.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-apk
          path: /tmp/guitar_tuner/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
