name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Flutter scaffold
        run: flutter create --org com.guitartuner --project-name guitar_tuner /tmp/guitar_tuner

      - name: Copy source files
        run: |
          cp -r lib/* /tmp/guitar_tuner/lib/
          cp pubspec.yaml /tmp/guitar_tuner/pubspec.yaml

      - name: Configure Android
        run: |
          python3 - <<'PYEOF'
          import re, pathlib

          # AndroidManifest — RECORD_AUDIO + MODIFY_AUDIO_SETTINGS
          manifest_path = pathlib.Path('/tmp/guitar_tuner/android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text()
          if 'RECORD_AUDIO' not in manifest:
              perms = (
                  '<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    '
              )
              manifest = manifest.replace('<application', perms + '<application')
              manifest_path.write_text(manifest)
          print("Manifest OK")

          # build.gradle — minSdk 21, remove ndkVersion
          gradle_path = pathlib.Path('/tmp/guitar_tuner/android/app/build.gradle')
          g = gradle_path.read_text()
          g = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', g)
          g = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', g)
          g = re.sub(r'minSdk\s+flutter\.minSdkVersion', 'minSdk 21', g)
          g = re.sub(r'[ \t]*ndkVersion[^\n]*\n', '', g)
          # Upgrade Java 1.8 → 11 (needed by record package's Kotlin code)
          g = g.replace('sourceCompatibility JavaVersion.VERSION_1_8', 'sourceCompatibility JavaVersion.VERSION_11')
          g = g.replace('targetCompatibility JavaVersion.VERSION_1_8', 'targetCompatibility JavaVersion.VERSION_11')
          g = g.replace("jvmTarget = '1.8'", "jvmTarget = '11'")

          gradle_path.write_text(g)

          # Print key lines for debugging
          for line in gradle_path.read_text().splitlines():
              if any(k in line for k in ['minSdk', 'ndk', 'compileSdk', 'targetSdk', 'jvmTarget', 'VERSION_']):
                  print(line)
          PYEOF

      - name: Flutter pub get
        working-directory: /tmp/guitar_tuner
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: /tmp/guitar_tuner
        run: flutter analyze --no-fatal-infos

      - name: Build debug APK
        working-directory: /tmp/guitar_tuner
        run: |
          flutter build apk --debug 2>&1 | tee /tmp/build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "======= GRADLE FAILURE DETAILS ======="
            grep -A5 "FAILURE\|What went wrong\|error:" /tmp/build.log | head -60
            exit $BUILD_STATUS
          fi

      - name: Find and list APK
        run: find /tmp/guitar_tuner/build -name "*.apk" 2>/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: guitar-tuner-apk
          path: /tmp/guitar_tuner/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
